<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Open ForkSmart</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --orange: #E0742B;
      --orange-dark: #d4551a;
      --cream: #FDF8F3;
      --ink: #1a1208;
      --ink-soft: #5a4a38;
      --ink-muted: #a0907e;
    }
    html, body {
      min-height: 100%;
      font-family: 'DM Sans', sans-serif;
      background-color: var(--cream);
      color: var(--ink);
    }
    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: #fff;
      border: 1px solid rgba(242, 101, 34, 0.12);
      border-radius: 20px;
      padding: 40px 32px;
      text-align: center;
      box-shadow: 0 16px 48px rgba(26, 18, 8, 0.06);
    }
    .icon {
      width: 64px; height: 64px;
      margin: 0 auto 20px;
      background: var(--orange);
      border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
    }
    .icon svg { width: 34px; height: 34px; }
    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 1.7rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 12px;
    }
    p { color: var(--ink-soft); line-height: 1.6; font-weight: 300; }
    .sub { color: var(--ink-muted); font-size: 0.9rem; margin-top: 16px; }
  </style>
</head>
<body>
  <main class="page">
    <div class="card">
      <div class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 11l19-9-9 19-2-8-8-2z" />
        </svg>
      </div>
      <h1>Open ForkSmart</h1>
      <p>If you have ForkSmart installed, it should open automatically.</p>
      <!-- App Store link added here once the listing is public. -->
      <p class="sub">Don't have the app yet? ForkSmart is coming to the App Store.</p>
    </div>
  </main>
</body>
</html>
