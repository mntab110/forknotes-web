<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, follow" />
  <title>Email Confirmed — ForkSmart</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --orange: #E0742B;
      --orange-dark: #d4551a;
      --orange-light: #fde8d8;
      --cream: #FDF8F3;
      --ink: #1a1208;
      --ink-soft: #5a4a38;
      --ink-muted: #a0907e;
      --success: #27ae60;
    }

    html, body {
      min-height: 100%;
      font-family: 'DM Sans', sans-serif;
      background-color: var(--cream);
      color: var(--ink);
    }

    /* Grain */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
      opacity: 0.6;
    }

    /* Nav */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      padding: 20px 40px;
      display: flex;
      align-items: center;
      background: rgba(253, 248, 243, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(242, 101, 34, 0.1);
    }

    .nav-logo { display: flex; align-items: center; gap: 12px; text-decoration: none; }

    .nav-icon {
      width: 40px; height: 40px;
      background: var(--orange);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
    }

    .nav-icon svg { width: 22px; height: 22px; }

    .nav-wordmark {
      font-family: 'Playfair Display', serif;
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--ink);
      letter-spacing: -0.02em;
    }

    /* Main layout */
    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 100px 24px 60px;
      position: relative;
      z-index: 1;
    }

    /* Card */
    .card {
      width: 100%;
      max-width: 420px;
      background: white;
      border-radius: 24px;
      padding: 48px 40px;
      box-shadow: 0 4px 6px rgba(26,18,8,0.04), 0 24px 80px rgba(26,18,8,0.08);
      text-align: center;
      animation: cardIn 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(30px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .success-icon {
      width: 72px; height: 72px;
      background: #e8f8ee;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 24px;
    }

    .success-icon svg { width: 38px; height: 38px; }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 1.85rem;
      font-weight: 700;
      color: var(--ink);
      letter-spacing: -0.025em;
      margin-bottom: 12px;
    }

    .desc {
      font-size: 0.95rem;
      color: var(--ink-soft);
      line-height: 1.6;
      margin-bottom: 8px;
    }

    .new-email {
      font-size: 1rem;
      font-weight: 500;
      color: var(--ink);
      margin-bottom: 8px;
      word-break: break-all;
    }

    .sub {
      font-size: 0.85rem;
      color: var(--ink-muted);
      line-height: 1.6;
      margin-bottom: 32px;
    }

    .btn-app {
      display: block;
      width: 100%;
      padding: 16px;
      background: var(--orange);
      color: white;
      border-radius: 14px;
      font-family: 'DM Sans', sans-serif;
      font-size: 1rem;
      font-weight: 500;
      text-decoration: none;
      transition: background 0.2s, box-shadow 0.2s, transform 0.1s;
      margin-bottom: 16px;
    }

    .btn-app:hover { background: var(--orange-dark); box-shadow: 0 8px 24px rgba(242, 101, 34, 0.3); }
    .btn-app:active { transform: scale(0.99); }

    .back-link {
      display: inline-block;
      font-size: 0.85rem;
      color: var(--orange);
      text-decoration: none;
      font-weight: 500;
      transition: opacity 0.2s;
    }

    .back-link:hover { opacity: 0.7; }

    @media (max-width: 480px) {
      .card { padding: 36px 24px; }
      nav { padding: 16px 20px; }
    }
  </style>
</head>
<body>

  <!-- Nav -->
  <nav>
    <a class="nav-logo" href="/">
      <div class="nav-icon" style="background:none">
        <img src="/Assets/opt/logo-icon.png" alt="ForkSmart" style="width:100%;height:100%;object-fit:contain;display:block">
      </div>
      <span class="nav-wordmark"><span style="color:#E0742B">Fork</span>Smart</span>
    </a>
  </nav>

  <main class="page">
    <div class="card">
      <div class="success-icon">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M5 13l4 4L19 7" stroke="#27ae60" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>

      <h1>Email Confirmed</h1>
      <p class="desc">Your email address has been confirmed.</p>
      <p class="new-email" id="newEmail" style="display:none;"></p>
      <p class="sub">You can now sign in to ForkSmart.</p>

      <a id="open-app" href="forknotes://email-confirmed" class="btn-app">Open ForkSmart</a>
      <a href="/" class="back-link">← Back to Home</a>
    </div>
  </main>

  <script type="module">
    import { createVerificationAnalytics } from '/Assets/verification-analytics.mjs';
    const analytics = createVerificationAnalytics({ token: 'phc_o2rMTTrpCysHF5ZPDj5e6dGzLxXvMRrLDan946A2UEEK' });
    document.getElementById('open-app').addEventListener('click', () => analytics.capture('verification_open_app_clicked'));
    const hash = new URLSearchParams(window.location.hash.slice(1));
    const query = new URLSearchParams(window.location.search);
    const token = hash.get('access_token') || '';
    const error = hash.get('error') || query.get('error') || hash.get('error_description') || query.get('error_description');
    history.replaceState(null, '', window.location.pathname);
    analytics.capture('verification_page_opened');
    try {
      if (error || !token) throw new Error('link_unavailable');
      const response = await fetch('https://npaszheuxcxoivelrlyq.supabase.co/auth/v1/user', {
        headers: { apikey: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5wYXN6aGV1eGN4b2l2ZWxybHlxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk0NTk5OTcsImV4cCI6MjA4NTAzNTk5N30.WeHsmZqqvlRWyWllroEjDA0oM746XpvfFux1BN6czQA', Authorization: `Bearer ${token}` }, signal: AbortSignal.timeout(15000)
      });
      const user = await response.json();
      if (!response.ok || !user.email_confirmed_at) throw new Error('verification_check_failed');
      analytics.identify(user);
      analytics.capture('verification_confirmed');
      if (user.email) { const el = document.getElementById('newEmail'); el.textContent = user.email; el.style.display = 'block'; }
    } catch (failure) {
      analytics.capture('verification_failed', error || !token ? 'link_unavailable' : 'verification_check_failed');
    }
  </script>
</body>
</html>
